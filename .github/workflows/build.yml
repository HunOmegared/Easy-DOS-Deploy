name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Vet (Windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build EasyRSB.exe
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/EasyRSB.exe .
          cp README.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRSB
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist && zip -9 ../EasyRSB-${GITHUB_REF_NAME}.zip *
          cd .. && gh release create "$GITHUB_REF_NAME" "EasyRSB-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
