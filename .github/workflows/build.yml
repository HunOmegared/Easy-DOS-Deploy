name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Test
        working-directory: src
        run: go test ./...
      - name: Vet (Windows)
        working-directory: src
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build EasyDDT.exe
        run: |
          mkdir -p dist
          (cd src && GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o ../dist/EasyDDT.exe .)
          cp README.md LICENSE dist/
      - name: Check the 16-bit code is up to date
        shell: bash
        run: |
          python3 asm/mbr.py  2>/dev/null | diff - <(tail -n +5 src/mbrcode.go)
          python3 asm/geom.py 2>/dev/null | diff - <(tail -n +5 src/geomcom.go)
      - uses: actions/upload-artifact@v4
        with:
          name: EasyDDT
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist && zip -9 ../EasyDDT-${GITHUB_REF_NAME}.zip *
          cd .. && gh release create "$GITHUB_REF_NAME" "EasyDDT-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
